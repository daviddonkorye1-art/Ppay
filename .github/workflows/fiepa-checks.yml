name: Fiepa Pay branch checks
on:
  pull_request:
    paths:
      - 'server/**'
      - 'test/**'
      - 'migrations/**'
      - 'package.json'
      - '.github/workflows/fiepa-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run ci
