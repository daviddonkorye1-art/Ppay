name: PurposePay v0.6 hardening

on:
  pull_request:
    branches: [main]
  push:
    branches: [v0.6-hardening]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run canonical CI gate
        run: npm run ci
